# Payu configuration

# If submitting to a different project to your default, uncomment line below 
# and change project code as appropriate; also set shortpath below
project: ol01
# Force payu to always find, and save, files in this scratch project directory
shortpath: /scratch/x77

# Using payu sync is recommend to copy data from ephemeral scratch space to 
# longer term storage
sync:
    enable: True   # set path below and change to true
    base_path: /g/data/ol01/outputs/access-om3-25km/   # Set to location on /g/data (e.g. /g/data/PROJECT/USER/)
    restarts: True
    exclude_uncollated: False

#Model software version
modules:
    use:
        - /g/data/vk83/modules
        - /g/data/vk83/prerelease/modules
    load:
        - access-om3/pr264-25
        - model-tools/mppnccombine-fast/2026.10.000-1

queue: normalsr
ncpus: 2704
jobfs: 10GB
mem: 13000GB
walltime: 8:00:00
jobname: 25km_ERA5_iaf_wombatlite

model: access-om3
exe: access-om3-MOM6-CICE6
input:
    - /g/data/tm70/aek156/make_om3_topo/kmt.nc
    - /g/data/vk83/configurations/inputs/access-om3/share/grids/global.25km/2026.06.11/ocean_hgrid.nc
    - /g/data/vk83/configurations/inputs/access-om3/mom/grids/mosaic/global.25km/2025.09.29/ocean_mosaic.nc
    - /g/data/vk83/configurations/inputs/access-om3/mom/grids/mosaic/share/2024.05.08/grid_spec.nc
    - /g/data/tm70/aek156/make_om3_topo/ocean_vgrid.nc
    - /g/data/vk83/configurations/inputs/access-om3/mom/initial_conditions/global.25km/2026.06.11/woa23_ts_01_mom.nc
    - /g/data/vk83/prerelease/configurations/inputs/access-om3/mom/surface_salt_restoring/global.25km/2026.09.22/salt_sfc_restore.nc
    - /g/data/tm70/aek156/make_om3_topo/bottom_roughness.nc
    - /g/data/tm70/aek156/make_om3_topo/tideamp.nc
    - /g/data/tm70/aek156/make_om3_topo/topog.nc
    - /g/data/tm70/aek156/make_om3_topo/chl_globcolour_monthly_clim.nc
    - /g/data/tm70/aek156/make_om3_topo/access-om3-25km-ESMFmesh.nc
    - /g/data/tm70/aek156/make_om3_topo/access-om3-25km-nomask-ESMFmesh.nc
    - /g/data/vk83/prerelease/configurations/inputs/access-om3/share/meshes/share/2026.07.30/ERA5-datm-ESMFmesh.nc
    - /g/data/vk83/configurations/inputs/access-om3/share/meshes/share/2026.01.21/JRA55do-drof-ESMFmesh.nc
    - /g/data/tm70/aek156/make_om3_topo/access-om3-25km-rof-remap-weights.nc
    - /g/data/tm70/aek156/make_om3_topo/access-om3-25km-rofi-climatology.nc
    - /g/data/tm70/aek156/make_om3_topo/SFe_Hamiltonetal2020_monthly_clim.nc
    - /g/data/tm70/aek156/make_om3_topo/CO2_gm_1750-2024.nc
    - /g/data/vk83/configurations/inputs/access-om3/wombat/initial_conditions/share/2026.05.07/wombatlite_ic.nc
    - /g/data/qv56/replicas/input4MIPs/CMIP6Plus/OMIP/MRI/MRI-JRA55-do-1-6-0/land/
    - /g/data/qv56/replicas/input4MIPs/CMIP6Plus/OMIP/MRI/MRI-JRA55-do-1-6-0/landIce/
    - /g/data/av17/access-nri/OM3/era5_rechunked_1h_yearly/

runlog: true
metadata: 
    enable: true
manifest:
  reproduce:
    exe: True
    input: True

mpi:
  flags:
  - --mca mpi_yield_when_idle true

collate:
  restart: false
  mpi: true
  walltime: 6:00:00
  mem: 30GB
  ncpus: 4
  queue: normalsr
  exe: mppnccombine-fast

userscripts:
    archive: /usr/bin/bash /g/data/vk83/apps/om3-scripts/payu_config/archive.sh

postscript: -v PROJECT,SCRIPTS_DIR=/g/data/vk83/apps/om3-scripts -lstorage=${PBS_NCI_STORAGE}+gdata/xp65 /g/data/vk83/apps/om3-scripts/payu_config/postscript.sh

qsub_flags: -W umask=027

restart_freq: 1YS
payu_minimum_version: 1.3.6

description: |-
  100 km ACCESS-OM3 global configuration with MOM6 (ocean), CICE6 (sea ice, C-grid dynamics with a floe size distribution) and WW3 (waves), coupled through CMEPS.
  Waves are coupled to the ocean (surface Stokes drift bands used for Langmuir turbulence in the ePBL scheme) and to sea ice.
  Initial ocean temperature and salinity are from WOA23. WW3 is initialised from a prescribed initial-condition file (restart.ww3).
  Run under interannually varying forcing, using hourly ERA5 atmospheric forcing and JRA55-do v1.6.0 river and land-ice runoff, 1 Jan 1958 - 31 Dec 2024.
  The coupling interval, CICE timestep and MOM6 baroclinic timestep are 1800 s (MOM6 DT_THERM is 7200 s).
  No biogeochemistry.

description: |-
  100 km ACCESS-OM3 global configuration with MOM6 (ocean) and CICE6 (sea ice, C-grid dynamics, no floe size distribution) coupled through CMEPS, without a wave model.
  Initial ocean temperature and salinity are from WOA23. The run is a cold start on 1 Jan 1958.
  Run under interannually varying forcing, using hourly ERA5 atmospheric forcing and JRA55-do v1.6.0 river and land-ice runoff, 1 Jan 1958 - 31 Dec 2024.
  The coupling interval and CICE timestep are 3600 s, the MOM6 baroclinic timestep is 3600 s and DT_THERM is 7200 s.
  No biogeochemistry.
